worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;

    upstream orchestrator_service { server orchestrator:3000; }
    upstream scraper_service { server scraper:5005; }
    upstream enrichment_service { server enrichment:5050; }
    upstream ai_swarm_service { server ai-swarm:4020; }
    upstream outreach_service { server outreach:8881; }
    upstream hr_finding_service { server hr-finding:3940; }
    upstream google_maps_service { server google-maps-scraper:3942; }
    upstream google_search_service { server google-search-scraper:3848; }
    upstream download_service { server download-automation:3939; }

    server {
        listen 80;

        # Health check for the gateway itself
        location /health {
            return 200 '{"status":"ok","gateway":"active"}';
            add_header Content-Type application/json;
        }

        # Routing to Microservices
        location /api/orchestrator/ {
            proxy_pass http://orchestrator_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/scraper/ {
            proxy_pass http://scraper_service/;
            proxy_set_header Host $host;
        }

        location /api/enrichment/ {
            proxy_pass http://enrichment_service/;
            proxy_set_header Host $host;
        }

        location /api/ai-swarm/ {
            proxy_pass http://ai_swarm_service/;
            proxy_set_header Host $host;
        }

        location /api/outreach/ {
            proxy_pass http://outreach_service/;
            proxy_set_header Host $host;
        }

        location /api/hr-finding/ {
            proxy_pass http://hr_finding_service/;
            proxy_set_header Host $host;
        }

        location /api/google-maps/ {
            proxy_pass http://google_maps_service/;
            proxy_set_header Host $host;
        }

        location /api/google-search/ {
            proxy_pass http://google_search_service/;
            proxy_set_header Host $host;
        }

        location /api/download/ {
            proxy_pass http://download_service/;
            proxy_set_header Host $host;
        }
    }
}

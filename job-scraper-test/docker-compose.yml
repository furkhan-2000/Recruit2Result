version: '3.8'

services:
  orchestrator:
    build: ./services/orchestrator
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SCRAPER_SERVICE_URL=http://scraper:5005
      - ENRICHMENT_SERVICE_URL=http://enrichment:5050
      - AI_SWARM_SERVICE_URL=http://ai-swarm:4020
      - OUTREACH_SERVICE_URL=http://outreach:8881
    env_file:
      - .env
    depends_on:
      - scraper
      - enrichment
      - ai-swarm
      - outreach
    networks:
      - recruit2result-net

  scraper:
    build: ./services/scraper
    ports:
      - "5005:5005"
    env_file:
      - .env
    networks:
      - recruit2result-net

  enrichment:
    build: ./services/enrichment
    ports:
      - "5050:5050"
    env_file:
      - .env
    networks:
      - recruit2result-net

  ai-swarm:
    build: ./services/ai-swarm
    ports:
      - "4020:4020"
    env_file:
      - .env
    networks:
      - recruit2result-net

  outreach:
    build: ./services/outreach
    ports:
      - "8881:8881"
    env_file:
      - .env
    networks:
      - recruit2result-net

networks:
  recruit2result-net:
    driver: bridge
